name: GitHub Repo Request
description: Request a new GitHub repository.
title: "github-repo-request: <repo-name>"
labels: ["Repository", "GitHub", "Repo Creation", "GitHub Repository"]
body:
  - type: input
    id: repo-name
    attributes:
      label: Repository Name
      description: The desired name for the new GitHub repository.
      placeholder: my-awesome-project
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Repository Purpose
      description: A brief description of what this repository will be used for.
      placeholder: This repo is for our new internal API.
    validations:
      required: true
  - type: dropdown
    id: visibility
    attributes:
      label: Repository Visibility
      description: Should this repository be public or private?
      options:
        - Public
        - Private
        - Internal
    validations:
      required: true
  - type: textarea
    id: team-membership
    attributes:
      label: Team/Collaborator Membership
      description: List the teams and/or individual GitHub usernames that need access to this repository.
      placeholder: |
        @my-organization/dev-team
        @johndoe
        @janedoe
    validations:
      required: true
  - type: textarea
    id: secrets-access
    attributes:
      label: Secrets Access
      description: If this repository needs access to any secrets, please list them and provide a brief justification for each.
      placeholder: |
        - SECRET_KEY: Used for API authentication.
        - DB_PASSWORD: For connecting to the production database.
  - type: input
    id: rulesets
    attributes:
      label: Rulesets
      description: Specify any required rulesets, such as branch protection rules (e.g., "main branch requires 2 approvals").
      placeholder: main branch requires 1 approval
  - type: textarea
    id: approvers
    attributes:
      label: Approvers
      description: List the GitHub usernames or teams who are authorized to approve this repository request.
      placeholder: |
        @my-organization/admins
        @janesmith
    validations:
      required: true

